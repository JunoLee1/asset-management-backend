apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: asset-erp-backend
  labels:
    cloud.googleapis.com/location: asia-northeast3
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '10'
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: asia-northeast3-docker.pkg.dev/assemanagement/asset-erp-backend/asset-erp-backend:latest
          ports:
            - name: http1
              containerPort: 3001
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            # ── 비민감 설정 ───────────────────────────────────────────
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3001'
            - name: UV_THREADPOOL_SIZE
              value: '8'
            - name: JWT_EXPIRES_IN
              value: 15m
            - name: JWT_REFRESH_EXPIRES_IN
              value: 7d
            - name: SMTP_FROM
              value: '자산관리 ERP <noreply@company.com>'
            # TODO: Cloud Run 배포 후 실제 서비스 URL로 교체
            - name: FRONTEND_URL
              value: 'http://10.178.0.3'
            - name: GOOGLE_CALLBACK_URL
              value: 'https://YOUR_CLOUD_RUN_URL/auth/google/callback'
            - name: KAKAO_CALLBACK_URL
              value: 'https://YOUR_CLOUD_RUN_URL/auth/kakao/callback'
            - name: NAVER_SMS_SERVICE_ID
              value: ''
            - name: NAVER_SMS_FROM_NUMBER
              value: ''
            # ── Secret Manager 참조 ───────────────────────────────────
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: DATABASE_URL
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_SECRET
                  key: latest
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_REFRESH_SECRET
                  key: latest
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_CLIENT_ID
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_CLIENT_SECRET
                  key: latest
            - name: KAKAO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: KAKAO_CLIENT_ID
                  key: latest
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: GMAIL_USER
                  key: latest
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: GMAIL_APP_PASSWORD
                  key: latest
            - name: NAVER_SMS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: NAVER_SMS_ACCESS_KEY
                  key: latest
            - name: NAVER_SMS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: NAVER_SMS_SECRET_KEY
                  key: latest
  traffic:
    - percent: 100
      latestRevision: true
