apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: asset-erp-backend
  labels:
    cloud.googleapis.com/location: asia-northeast3
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '10'
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cloudsql-instances: 'assemanagement:asia-northeast3:free-trial-first-project'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: asia-northeast3-docker.pkg.dev/assemanagement/asset-erp-backend/asset-erp-backend:8c0597ab14a9c7926d5ba194d8a54f5a58d9b60e
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          # prisma migrate deploy가 끝나야 포트가 열리므로, 기본 헬스체크 타임아웃보다
          # 여유를 두지 않으면 "failed to start and listen" 오류가 날 수 있다.
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          env:
            # ── 비민감 설정 ───────────────────────────────────────────
            - name: NODE_ENV
              value: production
            - name: UV_THREADPOOL_SIZE
              value: '8'
            - name: JWT_EXPIRES_IN
              value: 15m
            - name: JWT_REFRESH_EXPIRES_IN
              value: 7d
            - name: SMTP_FROM
              value: '자산관리 ERP <noreply@company.com>'
            # TODO: Cloud Run 배포 후 실제 서비스 URL로 교체
            - name: FRONTEND_URL
              value: 'http://10.178.0.3'
            - name: GOOGLE_CALLBACK_URL
              value: 'https://YOUR_CLOUD_RUN_URL/auth/google/callback'
            - name: KAKAO_CALLBACK_URL
              value: 'https://YOUR_CLOUD_RUN_URL/auth/kakao/callback'
            - name: NAVER_SMS_SERVICE_ID
              value: ''
            - name: NAVER_SMS_FROM_NUMBER
              value: ''
            # ── Secret Manager 참조 ───────────────────────────────────
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: DATABASE_URL
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_SECRET
                  key: latest
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_REFRESH_SECRET
                  key: latest
            # TODO: 실제 값 발급 후 Secret Manager에 버전 추가하고 아래 secretKeyRef 복구
            # (Secret Manager는 빈 payload를 허용하지 않아 현재는 미선언 상태 = process.env 미설정 = 코드의 ?? '' 기본값 적용)
            # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, KAKAO_CLIENT_ID, GMAIL_USER, GMAIL_APP_PASSWORD,
            # NAVER_SMS_ACCESS_KEY, NAVER_SMS_SECRET_KEY
  traffic:
    - percent: 100
      latestRevision: true
